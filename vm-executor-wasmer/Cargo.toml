[package]
name = "klever-chain-vm-executor-wasmer"
version = "0.2.2"
edition = "2021"
publish = false # will also be published, but it is not yet ready for that

[lib]

[dependencies.klever-chain-vm-executor]
version = "0.2.2"
path = "../vm-executor"

[dependencies]
wasmer = { git = "https://github.com/klever-io/wasmer", rev = "aa828ed", default-features = false, features = [
    "singlepass",
    "sys",
    "universal",
    "wat",
] }

wasmer-vm = { git = "https://github.com/klever-io/wasmer", rev = "aa828ed" }
wasmer-types = { git = "https://github.com/klever-io/wasmer", rev = "aa828ed" }

chrono = "0.4.23"
log = "0.4.17"
loupe = { git = "https://github.com/klever-io/loupe" }
