name: libvmexeccapi-build-linux-arm64

on:
  push:
    branches:
      - master
      - klever
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build library for Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/arm64
          file: ./Docker/arm64.dockerfile
          tags: arm-builder

      - name: Copy library from Docker image
        run: docker run --platform="linux/arm64" --rm arm-builder cat /data/libvmexeccapi_arm.so > $GITHUB_WORKSPACE/libvmexeccapi_arm.so

      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libs-linux-arm64
          path: |
            libvmexeccapi_arm.so
          if-no-files-found: error
